name: selftest
on:
  push:
    branches: [selftest]
permissions:
  contents: read
  id-token: write
  attestations: write
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      ZIZKADB_TELEMETRY: "false"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { repository: ZIZKA-AI-SL/ZizkaDB, path: zizkadb-src }
      - name: Build ZizkaDB image (GHCR images are private for now)
        run: docker build -q -f zizkadb-src/infra/allinone/Dockerfile -t zizkadb-local:test zizkadb-src
      - run: pip install -q zizkadb-sdk

      - name: WHY failing agent
        id: why_fail
        continue-on-error: true
        uses: ./
        with: { run: python selftest/agent.py --fail, image: "zizkadb-local:test" }
      - name: WHY no logging
        id: why_empty
        uses: ./
        with: { run: echo nothing logged, image: "zizkadb-local:test" }
      - name: AUDIT intact
        id: audit_ok
        uses: ZIZKA-AI-SL/zizkadb-audit-action@main
        with: { run: python selftest/agent.py, image: "zizkadb-local:test" }
      - name: AUDIT tampered
        id: audit_bad
        continue-on-error: true
        uses: ZIZKA-AI-SL/zizkadb-audit-action@main
        with:
          image: "zizkadb-local:test"
          attest: "false"
          run: |
            python selftest/agent.py
            docker exec zizkadb-action psql -U zizkadb -d zizkadb -tAc "UPDATE events SET data = data || '{\"tool\":\"cancel\"}' WHERE data->>'tool' = 'refund'"

      - name: Check results
        env:
          WF: ${{ steps.why_fail.outcome }}|${{ steps.why_fail.outputs.events }}|${{ steps.why_fail.outputs.chains }}|${{ steps.why_fail.outputs.command-exit-code }}
          WE: ${{ steps.why_empty.outcome }}|${{ steps.why_empty.outputs.events }}
          AO: ${{ steps.audit_ok.outcome }}|${{ steps.audit_ok.outputs.intact }}|${{ steps.audit_ok.outputs.events }}
          AB: ${{ steps.audit_bad.outcome }}|${{ steps.audit_bad.outputs.intact }}
        run: |
          echo "::notice title=why_fail::$WF"
          echo "::notice title=why_empty::$WE"
          echo "::notice title=audit_ok::$AO"
          echo "::notice title=audit_bad::$AB"
          ok=1
          [ "$WF" = "failure|5|1|1" ] || { echo "::error::why_fail expected failure|5|1|1"; ok=0; }
          [ "$WE" = "success|0" ] || { echo "::error::why_empty expected success|0"; ok=0; }
          [ "$AO" = "success|true|5" ] || { echo "::error::audit_ok expected success|true|5"; ok=0; }
          [ "$AB" = "failure|false" ] || { echo "::error::audit_bad expected failure|false"; ok=0; }
          [ "$ok" = 1 ]
